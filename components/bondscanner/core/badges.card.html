<!-- @dsCard group="Components" viewport="700x230" name="Badges" subtitle="status pills · ratings · counts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 28px 32px; -webkit-font-smoothing: antialiased; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; font-weight: 500; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Badge } = window.BondScannerDesignSystem_019dd8;
  function Demo() {
    return (
      <div>
        <p className="lbl">Light</p>
        <div className="row">
          <Badge color="green" dot>Confirmed</Badge>
          <Badge color="amber" dot>Pending</Badge>
          <Badge color="red" dot>Rejected</Badge>
          <Badge color="sky" leadingIcon={<i className="ri-verified-badge-fill" />}>Verified</Badge>
          <Badge color="blue">AAA</Badge>
          <Badge color="gray">Matured</Badge>
        </div>
        <p className="lbl">Filled</p>
        <div className="row">
          <Badge color="blue" variant="filled">AAA</Badge>
          <Badge color="green" variant="filled">+9.2%</Badge>
          <Badge color="purple" variant="filled" size="sm">New</Badge>
          <Badge color="red" variant="filled" size="sm">3</Badge>
        </div>
        <p className="lbl">Stroke</p>
        <div className="row">
          <Badge color="gray" variant="stroke">Tax-free</Badge>
          <Badge color="blue" variant="stroke">Secured</Badge>
          <Badge color="amber" variant="stroke">Closing soon</Badge>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
