<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  body { margin: 0; background: var(--surface-sunken); font-family: var(--font-sans); padding: 28px 32px; -webkit-font-smoothing: antialiased; }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px; font-weight: 500; }
  .ln { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); font-size: 14px; color: var(--text-title); }
  .ln:last-child { border-bottom: 0; }
  .mut { color: var(--text-body); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Card, Avatar, Badge, Button } = window.BondScannerDesignSystem_019dd8;
  function Demo() {
    return (
      <div className="grid">
        <Card title="Recent activity" action={<Button variant="ghost" size="sm">See all</Button>}>
          <div className="ln"><span>HDFC 9.1% 2027</span><Badge color="green" dot>Confirmed</Badge></div>
          <div className="ln"><span>Muthoot 10.2% 2026</span><Badge color="amber" dot>Pending</Badge></div>
          <div className="ln"><span>NABARD 7.4% 2029</span><span className="mut">₹25,000</span></div>
        </Card>
        <div>
          <p className="lbl">Avatars</p>
          <div className="row" style={{marginBottom:20}}>
            <Avatar initials="AK" color="blue" status="online" />
            <Avatar initials="TI" color="gray" size="lg" />
            <Avatar initials="RS" color="purple" size="sm" status="away" />
            <Avatar initials="M" color="amber" size="xs" />
          </div>
          <p className="lbl">Company</p>
          <div className="row"><Avatar initials="H" color="blue" size="lg" /><div><div style={{fontWeight:600,fontSize:14,color:"var(--text-title)"}}>HDFC Ltd</div><div style={{fontSize:13,color:"var(--text-body)"}}>AAA · Secured</div></div></div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
