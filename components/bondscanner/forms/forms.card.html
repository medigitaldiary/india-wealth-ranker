<!-- @dsCard group="Components" viewport="700x340" name="Form Controls" subtitle="inputs · switches · checkboxes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 28px 32px; -webkit-font-smoothing: antialiased; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; align-items: start; }
  .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px; font-weight: 500; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--text-title); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Switch, Checkbox } = window.BondScannerDesignSystem_019dd8;
  function Demo() {
    const [notify, setNotify] = React.useState(true);
    const [auto, setAuto] = React.useState(false);
    return (
      <div className="grid">
        <div className="stack">
          <Input label="Email" placeholder="hello@bondscanner.com" leadingIcon={<i className="ri-mail-line" />} />
          <Input label="Amount" required hint="Min ₹10,000" leadingIcon={<span style={{fontSize:14}}>₹</span>} defaultValue="50,000" />
          <Input label="PAN" error hint="Enter a valid 10-digit PAN" defaultValue="ABCD" />
        </div>
        <div className="stack">
          <p className="lbl" style={{margin:0}}>Toggles</p>
          <div className="toggle-row"><span>Order updates</span><Switch checked={notify} onChange={setNotify} /></div>
          <div className="toggle-row"><span>Auto-invest coupons</span><Switch checked={auto} onChange={setAuto} /></div>
          <p className="lbl" style={{margin:"6px 0 0"}}>Checkboxes</p>
          <Checkbox defaultChecked label="Reinvest at maturity" />
          <Checkbox label="I accept the risk disclosure" />
          <Checkbox indeterminate label="Select all holdings" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
